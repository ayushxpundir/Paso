<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso - Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/assests/Paso.png" type="image/x-png">
    <link rel="shortcut icon" href="/assests/Paso.ico" type="image/x-icon">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Paso</h1>
            <p class="subtitle">Generate strong & secure passwords instantly</p>

            <div class="result-container">
                <button id="copyBtn" title="Copy to clipboard" aria-label="Copy to clipboard" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                    </svg>
                </button>
                <div id="result" class="result-placeholder">Your password will appear here...</div>
            </div>

            <div class="form-body">
                <div class="input-group">
                    <label for="myinput">Length of Password</label>
                    <div class="input-wrapper">
                        <input type="number" id="myinput" min="5" max="100" placeholder="Enter (05 to 100)">
                        <button id="mysub">Generate</button>
                    </div>
                </div>

                <label class="section-label">Include Characters</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item select-all">
                        <input type="checkbox" id="selectAll" class="checkbox">
                        <span>Select All</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="c1" class="checkbox">
                        <span>Lowercase</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="c2" class="checkbox">
                        <span>Uppercase</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="c3" class="checkbox">
                        <span>Symbols</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="c4" class="checkbox">
                        <span>Numbers</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
